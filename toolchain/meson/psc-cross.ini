[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = '/opt/psc/bin/psc-pkg-config'

[built-in options]
c_args = ['-mcpu=cortex-a35', '-mfpu=neon-fp-armv8', '-mfloat-abi=hard']
cpp_args = ['-mcpu=cortex-a35', '-mfpu=neon-fp-armv8', '-mfloat-abi=hard']
cpp_link_args = ['-static-libstdc++', '-static-libgcc']

[properties]
sys_root = '/opt/psc/sysroot'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'cortex-a35'
endian = 'little'
