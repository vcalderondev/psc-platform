# Release: build every component from its pinned upstream version with the PSC patches,
# gate each one against the console (psc-check), and publish them with the changelog.
# Push a tag vX.Y.Z whose section exists in CHANGELOG.md.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)build and publish
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: psc-platform
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Changelog section for this tag
        run: psc-platform/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - uses: ./psc-platform/.github/actions/toolchain
        with:
          sysroot-token: ${{ secrets.PSC_SYSROOT_TOKEN }}
      - name: Wayland 1.26 + Weston 16.0.2
        run: $PSC_TOOLCHAIN/psc sh psc-platform/compositor/build.sh
      - name: RetroArch 1.22
        run: $PSC_TOOLCHAIN/psc sh psc-platform/retroarch/build.sh
      - name: Debug helpers (psc-crash.so)
        run: $PSC_TOOLCHAIN/psc sh psc-platform/tools/debug/build.sh
      - name: PCSX-ReARMed
        run: $PSC_TOOLCHAIN/psc sh psc-platform/cores/pcsx_rearmed/build.sh
      # Kernel modules for the stock Sony kernel (overlay.ko, xpad.ko), checked against the
      # stock BOOTIMG2 image, a private input: Sony's binary is never published.
      - name: Kernel modules (Sony 4.4.22 + overlay/xpad)
        env:
          GH_TOKEN: ${{ secrets.PSC_SYSROOT_TOKEN }}
        run: |
          gh release download psc-private-v1 -R vcalderondev/psc-sysroot -p stock-bootimg2.img -D "$RUNNER_TEMP" --clobber
          PSC_STOCK_BOOTIMG="$RUNNER_TEMP/stock-bootimg2.img" sh psc-platform/kernel/build-modules.sh
          rm -f "$RUNNER_TEMP/stock-bootimg2.img"
      # Lumen's boot payload, UNSIGNED (no key in this repository or its CI): lumen's release
      # signs it with .github/actions/boot-payload from a private input.
      - name: Boot payload (unsigned)
        run: sh psc-platform/boot/build-payload.sh --pack-only
      - name: Collect
        run: |
          O=psc-platform/out; D="$RUNNER_TEMP/dist"; mkdir -p "$D"
          sudo chown -R "$(id -u)" "$O"
          cp $O/compositor/psc-weston-16.tar.gz \
             $O/retroarch/psc-retroarch.tar.gz $O/retroarch/retroarch.debug $O/cores/pcsx_rearmed_libretro.so "$D/"
          for f in $O/compositor/psc-check*.txt; do cp "$f" "$D/compositor-$(basename "$f")"; done
          cp $O/retroarch/psc-check.txt "$D/retroarch-psc-check.txt"
          cp $O/cores/psc-check.txt "$D/cores-psc-check.txt"
          cp $O/debug/psc-crash.so "$D/"
          cp $O/boot/payload.tar.gz "$D/psc-boot-payload.tar.gz"
          tar czf "$D/psc-kernel-modules.tar.gz" -C $O/kernel modules/overlay.ko modules/xpad.ko \
              modules/SHA256SUMS modules/check.txt config.diff
          cp $O/kernel/modules/check.txt "$D/kernel-modules-check.txt"
          psc-platform/scripts/versions.sh "$TAG" > "$D/versions.txt"
          (cd "$D" && sha256sum * > SHA256SUMS)
          { cat "$RUNNER_TEMP/notes.md"; echo; echo "### Components"; echo '```'; cat "$D/versions.txt"; echo '```'; } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"; ls -la "$D"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd psc-platform
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/dist/* --title "psc-platform $TAG" --notes-file "$RUNNER_TEMP/body.md"
          fi
